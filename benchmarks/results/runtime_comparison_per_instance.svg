<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 320" width="650" height="320" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;">
  <style>
    .title { font-size: 15px; font-weight: bold; fill: #1f2937; }
    .subtitle { font-size: 12px; fill: #6b7280; }
    .bar-text { font-size: 11px; fill: #374151; font-weight: 600; text-anchor: middle; }
    .label { font-size: 12px; fill: #374151; text-anchor: middle; }
  </style>
  <text x="30" y="30" class="title">Placement Engine Runtime by Benchmark Instance (Random Placer)</text>
  <text x="30" y="48" class="subtitle">Mean execution time in milliseconds per complete placement run.</text>
  <g transform="translate(50, 70)">
    <rect width="550" height="210" fill="#f9fafb" rx="8" stroke="#e5e7eb"/>
    <line x1="40" y1="170.0" x2="530" y2="170.0" stroke="#e5e7eb" stroke-dasharray="3,3"/>
    <text x="35" y="174.0" font-size="10" fill="#9ca3af" text-anchor="end">0ms</text>
    <line x1="40" y1="135.0" x2="530" y2="135.0" stroke="#e5e7eb" stroke-dasharray="3,3"/>
    <text x="35" y="139.0" font-size="10" fill="#9ca3af" text-anchor="end">5ms</text>
    <line x1="40" y1="100.0" x2="530" y2="100.0" stroke="#e5e7eb" stroke-dasharray="3,3"/>
    <text x="35" y="104.0" font-size="10" fill="#9ca3af" text-anchor="end">10ms</text>
    <line x1="40" y1="65.0" x2="530" y2="65.0" stroke="#e5e7eb" stroke-dasharray="3,3"/>
    <text x="35" y="69.0" font-size="10" fill="#9ca3af" text-anchor="end">15ms</text>
    <line x1="40" y1="30.0" x2="530" y2="30.0" stroke="#e5e7eb" stroke-dasharray="3,3"/>
    <text x="35" y="34.0" font-size="10" fill="#9ca3af" text-anchor="end">20ms</text>
    <rect x="90" y="132.11055867024697" width="60" height="37.889441329753026" fill="#3b82f6" rx="4"/>
    <text x="120.0" y="126.11055867024697" class="bar-text">5.41 ms</text>
    <text x="120.0" y="190" class="label">toy_4</text>
    <rect x="230" y="69.21555399875311" width="60" height="100.78444600124689" fill="#10b981" rx="4"/>
    <text x="260.0" y="63.21555399875311" class="bar-text">14.40 ms</text>
    <text x="260.0" y="190" class="label">medium_8</text>
    <rect x="370" y="59.22188970415543" width="60" height="110.77811029584457" fill="#f59e0b" rx="4"/>
    <text x="400.0" y="53.22188970415543" class="bar-text">15.83 ms</text>
    <text x="400.0" y="190" class="label">dense_10</text>
  </g>
</svg>