[project]
name = "macro-placement-floorplanning"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "gymnasium>=1.4.0",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
rl = [
    "sb3-contrib>=2.5.0",
    "stable-baselines3>=2.5.0",
    "torch>=2.2.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.12",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.mypy]
explicit_package_bases = true

